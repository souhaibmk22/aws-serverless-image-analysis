<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker solid -->
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#71717a"/>
    </marker>
    <!-- Arrow marker dashed -->
    <marker id="arrowhead-dashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#a1a1aa"/>
    </marker>
  </defs>

  <!-- 1. Node: Client -->
  <g>
    <rect x="25" y="165" width="130" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="90" y="194" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Client</text>
    <text x="90" y="213" font-size="12" fill="#71717a" text-anchor="middle">Upload image</text>
  </g>

  <!-- Arrow: Client -> Amazon S3 -->
  <line x1="155" y1="197" x2="190" y2="197" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 2. Node: Amazon S3 -->
  <g>
    <rect x="195" y="165" width="130" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="260" y="194" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Amazon S3</text>
    <text x="260" y="213" font-size="12" fill="#71717a" text-anchor="middle">Storage</text>
  </g>

  <!-- Arrow: Amazon S3 -> AWS Lambda -->
  <line x1="325" y1="197" x2="360" y2="197" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 3. Node: AWS Lambda -->
  <g>
    <rect x="365" y="165" width="140" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="435" y="194" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">AWS Lambda</text>
    <text x="435" y="213" font-size="12" fill="#71717a" text-anchor="middle">Python 3.12</text>
  </g>

  <!-- 4. Branch 1: Safety Classifier (CLIP ViT-B/32) -->
  <g>
    <rect x="585" y="30" width="245" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="707" y="59" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Safety Classifier</text>
    <text x="707" y="78" font-size="12" fill="#71717a" text-anchor="middle">CLIP ViT-B/32</text>
  </g>
  <!-- Arrow: Lambda -> Safety Classifier -->
  <line x1="505" y1="185" x2="580" y2="70" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 5. Branch 2: Amazon DynamoDB (Stores results) -->
  <g>
    <rect x="585" y="125" width="245" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="707" y="154" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Amazon DynamoDB</text>
    <text x="707" y="173" font-size="12" fill="#71717a" text-anchor="middle">Stores results</text>
  </g>
  <!-- Arrow: Lambda -> DynamoDB -->
  <line x1="505" y1="193" x2="580" y2="160" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 6. Branch 3: Amazon SNS (Email alert) -->
  <g>
    <rect x="585" y="220" width="245" height="64" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="707" y="249" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Amazon SNS</text>
    <text x="707" y="268" font-size="12" fill="#71717a" text-anchor="middle">Email alert</text>
  </g>
  <!-- Arrow: Lambda -> Amazon SNS -->
  <line x1="505" y1="202" x2="580" y2="245" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 7. Branch 4: Amazon Rekognition (Optional alternative - dashed) -->
  <g>
    <rect x="585" y="315" width="245" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5,5"/>
    <text x="707" y="344" font-size="14" font-weight="600" fill="#09090b" text-anchor="middle">Amazon Rekognition</text>
    <text x="707" y="363" font-size="12" fill="#71717a" text-anchor="middle">Optional alternative</text>
  </g>
  <!-- Dashed Arrow: Lambda -> Rekognition -->
  <line x1="505" y1="215" x2="580" y2="335" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead-dashed)"/>
</svg>
