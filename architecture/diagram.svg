<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="950" height="480" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-lambda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="grad-rekog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="grad-dynamo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-sns" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Title & Header -->
  <text x="40" y="50" font-size="22" font-weight="bold" fill="#ffffff">Architecture AWS Serverless &amp; Event-Driven</text>
  <text x="40" y="75" font-size="13" fill="#94a3b8">Pipeline automatisé d'analyse d'images et modération avec Amazon Rekognition &amp; Terraform</text>

  <!-- Cloud Boundary Box -->
  <rect x="40" y="100" width="870" height="340" rx="16" fill="#131c31" stroke="#1e293b" stroke-width="2"/>
  <text x="65" y="130" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="1">AWS CLOUD (REGION EU-WEST-3)</text>

  <!-- S3 Block -->
  <g transform="translate(70, 160)">
    <rect width="140" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="20" width="45" height="45" rx="8" fill="url(#grad-s3)"/>
    <text x="37" y="48" font-size="20" text-anchor="middle" fill="#fff">🪣</text>
    <text x="15" y="90" font-size="14" font-weight="bold" fill="#ffffff">Amazon S3</text>
    <text x="15" y="110" font-size="11" fill="#94a3b8">Bucket d'ingestion</text>
    <text x="15" y="130" font-size="10" fill="#64748b">• Chiffrement AES-256</text>
    <text x="15" y="145" font-size="10" fill="#64748b">• Block Public Access</text>
    <text x="15" y="160" font-size="10" fill="#f59e0b">Event: ObjectCreated</text>
  </g>

  <!-- Arrow S3 -> Lambda -->
  <path d="M 210 250 L 270 250" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="270,246 280,250 270,254" fill="#f59e0b"/>

  <!-- Lambda Block -->
  <g transform="translate(280, 160)">
    <rect width="150" height="180" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="15" y="20" width="45" height="45" rx="8" fill="url(#grad-lambda)"/>
    <text x="37" y="48" font-size="20" text-anchor="middle" fill="#fff">⚡</text>
    <text x="15" y="90" font-size="14" font-weight="bold" fill="#ffffff">AWS Lambda</text>
    <text x="15" y="110" font-size="11" fill="#94a3b8">Runtime Python 3.12</text>
    <text x="15" y="130" font-size="10" fill="#64748b">• SDK Boto3</text>
    <text x="15" y="145" font-size="10" fill="#64748b">• IAM Least-Privilege</text>
    <text x="15" y="160" font-size="10" fill="#fbbf24">• Orchestration Serverless</text>
  </g>

  <!-- Branching Arrows from Lambda -->
  <path d="M 430 200 L 510 180" stroke="#a855f7" stroke-width="2"/>
  <polygon points="508,176 518,178 510,184" fill="#a855f7"/>

  <path d="M 430 250 L 510 250" stroke="#3b82f6" stroke-width="2"/>
  <polygon points="510,246 520,250 510,254" fill="#3b82f6"/>

  <path d="M 430 300 L 510 320" stroke="#ef4444" stroke-width="2"/>
  <polygon points="510,316 518,322 508,324" fill="#ef4444"/>

  <!-- Rekognition Block -->
  <g transform="translate(520, 130)">
    <rect width="210" height="90" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="15" y="15" width="35" height="35" rx="6" fill="url(#grad-rekog)"/>
    <text x="32" y="38" font-size="16" text-anchor="middle" fill="#fff">🧠</text>
    <text x="60" y="35" font-size="13" font-weight="bold" fill="#ffffff">Amazon Rekognition</text>
    <text x="60" y="52" font-size="10" fill="#a855f7">detect_labels() &amp; moderation</text>
    <text x="15" y="75" font-size="10" fill="#94a3b8">Vision par ordinateur (Objets + Modération)</text>
  </g>

  <!-- DynamoDB Block -->
  <g transform="translate(520, 230)">
    <rect width="210" height="85" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="15" width="35" height="35" rx="6" fill="url(#grad-dynamo)"/>
    <text x="32" y="38" font-size="16" text-anchor="middle" fill="#fff">📊</text>
    <text x="60" y="35" font-size="13" font-weight="bold" fill="#ffffff">Amazon DynamoDB</text>
    <text x="60" y="52" font-size="10" fill="#38bdf8">Mode On-Demand (0€ fixe)</text>
    <text x="15" y="75" font-size="10" fill="#94a3b8">Stockage des métadonnées &amp; résultats JSON</text>
  </g>

  <!-- SNS Block -->
  <g transform="translate(520, 325)">
    <rect width="210" height="85" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="15" width="35" height="35" rx="6" fill="url(#grad-sns)"/>
    <text x="32" y="38" font-size="16" text-anchor="middle" fill="#fff">📬</text>
    <text x="60" y="35" font-size="13" font-weight="bold" fill="#ffffff">Amazon SNS</text>
    <text x="60" y="52" font-size="10" fill="#f87171">Alerte sécurité immédiate</text>
    <text x="15" y="75" font-size="10" fill="#94a3b8">Email dispatché si contenu sensible</text>
  </g>

  <!-- Terraform Badge -->
  <g transform="translate(755, 230)">
    <rect width="135" height="85" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="820" y="260" font-size="12" font-weight="bold" fill="#818cf8" text-anchor="middle">🏗️ Terraform</text>
    <text x="820" y="280" font-size="10" fill="#94a3b8" text-anchor="middle">100% Déployé en IaC</text>
    <text x="820" y="295" font-size="9" fill="#64748b" text-anchor="middle">Reproduisible en 1 clic</text>
  </g>
</svg>
